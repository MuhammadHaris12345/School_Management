<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduPak – School Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
.card{@apply bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-5 border border-slate-100 dark:border-slate-700}
.btn{@apply px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 transition shadow-sm}
.btn2{@apply px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-sm hover:bg-emerald-100 dark:hover:bg-slate-600 transition}
.inp{@apply w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-transparent dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-400 mt-1}
th{@apply text-left text-xs font-semibold text-slate-500 p-2 whitespace-nowrap}
td{@apply p-2 border-t border-slate-100 dark:border-slate-700 text-sm}
.nav{@apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm text-emerald-50 hover:bg-white/10 cursor-pointer transition}
.nav.on{@apply bg-white text-emerald-800 font-semibold shadow}
</style>
<style>
body{font-family:Poppins,sans-serif}.urdu{font-family:'Noto Nastaliq Urdu',serif;font-weight:400}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fade{animation:fi .35s}
option{color:#111}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%}
#modal>div{position:static!important;overflow:visible!important;display:block!important;background:none!important;padding:0!important}.no-print{display:none!important}@page{margin:10mm}}
</style></head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-sky-50 dark:from-slate-900 dark:via-slate-900 dark:to-slate-900 text-slate-700 dark:text-slate-200 min-h-screen">
<aside id="sb" class="fixed inset-y-0 left-0 w-64 bg-gradient-to-b from-emerald-700 via-emerald-800 to-teal-900 z-40 -translate-x-full lg:translate-x-0 transition flex flex-col p-4 overflow-auto">
 <div class="flex items-center gap-3 px-2 py-4 mb-2">
  <div class="w-12 h-12 rounded-2xl bg-white/90 text-emerald-700 flex items-center justify-center text-2xl"><i class="fa fa-graduation-cap"></i></div>
  <div class="text-white"><div id="sname" class="font-bold leading-tight text-sm"></div><div class="text-[11px] text-emerald-200">Logo Placeholder • EduPak</div></div></div>
 <nav id="nav" class="space-y-1 flex-1"></nav>
 <div class="text-[11px] text-emerald-200 text-center pt-3">100% Paperless School • <span class="urdu">کاغذ سے پاک</span></div>
</aside>
<div class="lg:ml-64">
 <header class="sticky top-0 z-30 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-100 dark:border-slate-700 px-4 py-3 flex items-center justify-between no-print">
  <button class="lg:hidden btn2" onclick="sbt()"><i class="fa fa-bars"></i></button>
  <div class="text-sm text-slate-500 hidden sm:block"><i class="fa fa-calendar-day text-emerald-600"></i> <span id="dt"></span></div>
  <div class="flex gap-2 items-center"><button class="btn2" onclick="go('demo')"><i class="fa fa-circle-play text-emerald-600"></i> Demo Guide</button>
  <button class="btn2" onclick="dark()"><i class="fa fa-moon"></i></button></div></header>
 <main id="main" class="p-4 lg:p-8 fade"></main>
</div>
<div id="modal"></div><div id="toasts" class="fixed top-4 right-4 z-[60]"></div>
<script>
const SUB=['Urdu','English','Math','Science','Islamiat'],CATS=['Fees','Admission','Donation','Salaries','Utilities','Rent','Maintenance','Marketing','Stationery','Other'];
const NAV=[['dash','fa-gauge-high','Dashboard','ڈیش بورڈ'],['students','fa-user-graduate','Students','طلباء'],['staff','fa-chalkboard-user','Staff','اسٹاف'],['att','fa-clipboard-user','Attendance','حاضری'],['fees','fa-file-invoice-dollar','Fees & Vouchers','فیس'],['exams','fa-pen-to-square','Exams & Marks','امتحانات'],['acc','fa-wallet','Accounts','حساب کتاب'],['classes','fa-school','Classes','کلاسز'],['mkt','fa-bullhorn','Marketing Toolkit','مارکیٹنگ'],['demo','fa-circle-play','Demo Guide','ڈیمو']];
const LIB=[['🔬','Science Fair','سائنس فیئر'],['🇵🇰','Independence Day (14 August)','یومِ آزادی'],['🏆','Sports Day','سپورٹس ڈے'],['📢','New Admissions Open','داخلے جاری'],['🎓','Result Day','رزلٹ ڈے'],['👨‍👩‍👧','Parent-Teacher Meeting','پیرنٹ ٹیچر میٹنگ'],['🎭','Annual Function','سالانہ تقریب'],['🌙','Eid Celebration','عید تقریب'],['🥇','Position Holders Honoured','پوزیشن ہولڈرز'],['🎨','Art & Calligraphy Competition','آرٹ مقابلہ'],['📖','Quran Recitation / Naat Competition','نعت و قرأت'],['🎁','Free Trial Class Week','مفت ٹرائل کلاس']];
let D,ui={},page='dash',OUT=[];const K='edupak_v1',P={};
const $=i=>document.getElementById(i),save=()=>localStorage.setItem(K,JSON.stringify(D));
const ds=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ds(new Date()),curM=()=>today().slice(0,7);
const addM=(m,n)=>{let[y,o]=m.split('-').map(Number);o+=n;while(o<1){o+=12;y--}while(o>12){o-=12;y++}return y+'-'+String(o).padStart(2,'0')};
const mL=m=>new Date(m+'-01').toLocaleString('en',{month:'long',year:'numeric'}),uid=()=>Math.random().toString(36).slice(2,8);
const PKR=n=>'Rs '+Math.round(+n||0).toLocaleString('en-US'),sum=a=>a.reduce((x,y)=>x+(typeof y=='number'?y:+y.amt||0),0);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),stu=id=>D.students.find(s=>s.id==id);
const vPaid=v=>sum(D.pays.filter(p=>p.vid==v.id)),vBal=v=>v.amt-vPaid(v),vst=v=>vBal(v)<=0?'Paid':vPaid(v)>0?'Partial':'Due';
const fst=id=>{const v=D.vouch.find(v=>v.sid==id&&v.month==curM());return v?vst(v):'No Voucher'};
const bd=t=>{const c={Paid:'emerald',Partial:'amber',Due:'rose','No Voucher':'slate',Income:'emerald',Expense:'rose',P:'emerald',A:'rose',L:'amber'}[t]||'sky';return`<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-${c}-100 text-${c}-700">${t}</span>`};
const empty=(t,m)=>`<div class="text-center py-10 text-slate-400"><i class="fa fa-folder-open text-4xl mb-2"></i><div class="font-semibold">${t}</div><div class="text-sm">${m}</div></div>`;
const head=(t,u,b)=>`<div class="flex items-center justify-between flex-wrap gap-3 mb-5"><h1 class="text-2xl font-bold">${t} <span class="urdu text-emerald-600 text-lg">${u}</span></h1><div class="flex gap-2 flex-wrap">${b||''}</div></div>`;
const grade=p=>p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'F';
const log=m=>{D.log.unshift({t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),d:today(),m});D.log.length=Math.min(D.log.length,30)};
const attPct=(id,k)=>{const x=Object.values(D[k]).filter(d=>d[id]);return x.length?Math.round(x.filter(d=>d[id]!='A').length*100/x.length):'—'};
function toast(m,t){const d=document.createElement('div');d.className='px-4 py-3 rounded-xl text-white text-sm shadow-lg mb-2 fade '+(t=='err'?'bg-rose-600':'bg-emerald-600');d.innerHTML=m;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function modal(h,f,w){$('modal').innerHTML=`<div class="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-auto" onclick="if(event.target==this)closeModal()"><${f?'form id="mf"':'div'} class="card ${w||'max-w-lg'} w-full my-8 fade">${h}</${f?'form':'div'}></div>`}
const closeModal=()=>$('modal').innerHTML='';
function form(t,f,v,cb){v=v||{};modal(`<h3 class="text-lg font-bold mb-3">${t}</h3><div class="grid grid-cols-2 gap-3">${f.map(([k,l,ty,o])=>`<label class="text-xs font-semibold ${ty=='wide'?'col-span-2':''}">${l}${ty=='select'?`<select name="${k}" class="inp">${o.map(x=>`<option ${v[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${k}" type="${ty=='wide'?'text':ty||'text'}" value="${E(v[k])}" class="inp" required>`}</label>`).join('')}</div><div class="flex justify-end gap-2 mt-4"><button type="button" onclick="closeModal()" class="btn2">Cancel</button><button class="btn"><i class="fa fa-check"></i> Save</button></div>`,1);
 $('mf').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));closeModal()}}
const sbt=()=>$('sb').classList.toggle('-translate-x-full');
function dark(){document.documentElement.classList.toggle('dark');localStorage.setItem('edupak_dk',document.documentElement.classList.contains('dark')?1:'')}
function go(p){page=p;$('sb').classList.add('-translate-x-full');render();scrollTo(0,0)}
function render(){$('main').innerHTML=P[page]();$('main').classList.remove('fade');void $('main').offsetWidth;$('main').classList.add('fade');
 $('nav').innerHTML=NAV.map(n=>`<div class="nav ${n[0]==page?'on':''}" onclick="go('${n[0]}')"><i class="fa ${n[1]} w-5 text-center"></i><span class="flex-1">${n[2]}</span><span class="urdu text-xs opacity-70">${n[3]}</span></div>`).join('');
 $('sname').textContent=D.school;$('dt').textContent=new Date().toDateString()}

/* ---------- data helpers ---------- */
function mkV(s,m){if(D.vouch.some(v=>v.sid==s.id&&v.month==m))return 0;const c=D.classes.find(c=>c.n==s.cls);D.vouch.push({id:uid(),no:'V-'+(++D.vn),sid:s.id,month:m,amt:c?+c.fee:0});return 1}
function addPay(v,amt,date,method,quiet){D.pays.push({id:uid(),vid:v.id,sid:v.sid,amt:+amt,date,method});const s=stu(v.sid);D.acc.push({id:uid(),date,type:'Income',cat:'Fees',amt:+amt,note:`Fee ${s.name} (${mL(v.month)})`});if(!quiet)log(`Fee received ${PKR(amt)} from ${s.name}`)}
function genV(m){let n=0;D.students.forEach(s=>n+=mkV(s,m));save();log(`${n} fee vouchers generated for ${mL(m)}`);return n}
function seed(){const t=today(),cm=curM(),pm=addM(cm,-1);
 const cl=[['Nursery',1500],['Prep',1800],['Class 1',2000],['Class 2',2200],['Class 3',2400],['Class 4',2600],['Class 5',2800],['Class 6',3200],['Class 7',3500],['Class 8',3800],['Class 9',4500],['Class 10',4800],['Intermediate',6000]];
 D={school:'Bright Future School',phone:'0300-1234567',classes:cl.map(c=>({n:c[0],sec:'A,B',fee:c[1]})),students:[],staff:[],att:{},satt:{},vouch:[],pays:[],marks:{},acc:[],log:[],vn:1000};
 const nm=['Ahmed Raza','Ayesha Noor','Bilal Khan','Fatima Zahra','Hamza Ali','Maryam Iqbal','Usman Tariq','Hira Shahid','Zain Abbas','Sana Malik','Hassan Mehmood','Zoya Hussain','Taha Siddiqui','Areeba Khan','Ali Hamza','Iqra Nadeem'],cs=['Class 1','Class 5','Class 5','Class 8','Class 8','Prep','Class 3','Class 10'];
 nm.forEach((n,i)=>D.students.push({id:'s'+i,name:n,cls:cs[i%8],sec:i<8?'A':'B',roll:String(i+1),parent:'Mr. '+n.split(' ')[1],phone:'0300-12345'+(10+i),addr:`House ${i+5}, Block ${'ABCD'[i%4]}, Model Colony`,adm:'2025-04-'+String(10+i)}));
 [['Sir Imran Ali','Teacher',38000],['Miss Sadia Khan','Teacher',34000],['Miss Rabia Noor','Teacher',32000],['Sir Kamran Shah','Teacher',30000],['Mrs. Nasreen Akhtar','Principal',70000],['Rafiq Ahmed','Peon',18000],['Shabbir Hussain','Guard',20000]].forEach((x,i)=>D.staff.push({id:'t'+i,name:x[0],role:x[1],sal:x[2],join:'2024-0'+(1+i)+'-01',phone:'0321-98765'+(10+i)}));
 for(let i=1;i<=5;i++){const d=ds(new Date(Date.now()-i*864e5));D.att[d]={};D.satt[d]={};D.students.forEach(s=>D.att[d][s.id]=Math.random()<.9?'P':Math.random()<.6?'A':'L');D.staff.forEach(s=>D.satt[d][s.id]=Math.random()<.95?'P':'A')}
 D.students.forEach(s=>{mkV(s,pm);mkV(s,cm)});
 D.students.forEach((s,i)=>{const pv=D.vouch.find(v=>v.sid==s.id&&v.month==pm),cv=D.vouch.find(v=>v.sid==s.id&&v.month==cm);
  if(i%11!=5)addPay(pv,i%7==3?Math.round(pv.amt/2):pv.amt,pm+'-'+String(3+i%8).padStart(2,'0'),'Cash',1);
  if(i%5==0)addPay(cv,cv.amt,t,i%2?'Cash':'JazzCash',1);else if(i%5==1)addPay(cv,cv.amt,cm+'-01','Cash',1)});
 D.marks['Mid Term']={};D.students.forEach(s=>D.marks['Mid Term'][s.id]=SUB.map(()=>55+Math.random()*43|0));
 [[cm+'-02','Expense','Rent',45000,'Building rent'],[cm+'-03','Expense','Marketing',5000,'Facebook & Instagram ads'],[cm+'-05','Expense','Utilities',18500,'Electricity & internet bill'],[t,'Expense','Stationery',3200,'Markers & registers'],[pm+'-28','Expense','Salaries',sum(D.staff.map(s=>s.sal)),'Staff salaries '+mL(pm)],[t,'Income','Donation',10000,'Parent donation – library']].forEach(a=>D.acc.push({id:uid(),date:a[0],type:a[1],cat:a[2],amt:a[3],note:a[4]}));
 log('Demo data loaded – Welcome to EduPak!');log('4 fee payments received today')}

/* ---------- Dashboard ---------- */
P.dash=()=>{const t=today(),m=curM(),tc=sum(D.pays.filter(p=>p.date==t)),mc=sum(D.pays.filter(p=>p.date.startsWith(m))),pend=sum(D.vouch.map(vBal));
 const ta=D.att[t]||{},tot=Object.keys(ta).length,pr=Object.values(ta).filter(x=>x!='A').length,pct=tot?Math.round(pr*100/tot):null;
 const sa=D.satt[t]||{},card=(i,c,l,u,v,s)=>`<div class="card flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-${c}-100 text-${c}-600 flex items-center justify-center text-xl"><i class="fa ${i}"></i></div><div><div class="text-xs text-slate-500">${l} <span class="urdu">${u}</span></div><div class="text-xl font-bold">${v}</div><div class="text-[11px] text-slate-400">${s||''}</div></div></div>`;
 const days=[...Array(7)].map((_,i)=>ds(new Date(Date.now()-(6-i)*864e5))),vals=days.map(d=>sum(D.pays.filter(p=>p.date==d))),mx=Math.max(...vals,1);
 const df={};D.vouch.forEach(v=>{const b=vBal(v);if(b>0)df[v.sid]=(df[v.sid]||0)+b});const dl=Object.entries(df).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `<div class="rounded-3xl bg-gradient-to-r from-emerald-600 to-sky-600 text-white p-6 mb-6 flex flex-wrap items-center justify-between gap-4 shadow-lg"><div><div class="urdu text-lg">السلام علیکم، پرنسپل صاحب 👋</div><div class="text-2xl font-bold mt-1">${E(D.school)}</div><div class="text-emerald-100 text-sm">Aaj ka poora school ek nazar mein — bina kisi register ke.</div></div>
 <div class="flex flex-wrap gap-2"><button class="btn !bg-white !text-emerald-700" onclick="editStu()"><i class="fa fa-user-plus"></i> Admission</button><button class="btn !bg-white !text-emerald-700" onclick="go('fees')"><i class="fa fa-money-bill"></i> Collect Fee</button><button class="btn !bg-white !text-emerald-700" onclick="go('att')"><i class="fa fa-check"></i> Attendance</button><button class="btn !bg-white !text-emerald-700" onclick="go('mkt')"><i class="fa fa-bullhorn"></i> Create Post</button></div></div>
 <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mb-6">${card('fa-user-graduate','emerald','Total Students','طلباء',D.students.length,D.classes.length+' classes')}${card('fa-chalkboard-user','sky','Total Staff','اسٹاف',D.staff.length,'Teachers & staff')}${card('fa-clipboard-check','teal',"Today's Attendance",'حاضری',pct===null?'Not marked':pct+'%','Staff present: '+Object.values(sa).filter(x=>x!='A').length+'/'+D.staff.length)}${card('fa-hourglass-half','rose','Pending Fees','بقایا',PKR(pend),D.vouch.filter(v=>vBal(v)>0).length+' vouchers open')}${card('fa-coins','amber',"Today's Collection",'آج کی وصولی',PKR(tc),D.pays.filter(p=>p.date==t).length+' payments')}${card('fa-chart-line','indigo','Monthly Collection','ماہانہ وصولی',PKR(mc),mL(m))}</div>
 <div class="grid lg:grid-cols-3 gap-4 mb-4"><div class="card lg:col-span-2"><h3 class="font-bold mb-4">Fee Collection – Last 7 Days</h3><div class="flex items-end gap-3 h-44">${vals.map((v,i)=>`<div class="flex-1 flex flex-col items-center justify-end h-full"><div class="text-[10px] text-slate-400">${v?Math.round(v/1000)+'k':''}</div><div class="w-full rounded-t-xl bg-gradient-to-t from-emerald-500 to-sky-400" style="height:${Math.max(v/mx*100,3)}%"></div><div class="text-[10px] mt-1">${days[i].slice(5)}</div></div>`).join('')}</div></div>
 <div class="card text-center"><h3 class="font-bold mb-4">Attendance Overview</h3>${pct===null?empty('Not marked yet','Open Attendance and mark today'):`<div class="mx-auto w-36 h-36 rounded-full flex items-center justify-center" style="background:conic-gradient(#10b981 ${pct}%,#fecaca 0)"><div class="w-28 h-28 rounded-full bg-white dark:bg-slate-800 flex flex-col items-center justify-center"><b class="text-2xl">${pct}%</b><span class="text-xs">Present</span></div></div><div class="text-sm mt-3">${pr} present • ${tot-pr} absent</div>`}</div></div>
 <div class="grid lg:grid-cols-2 gap-4"><div class="card"><h3 class="font-bold mb-3">Recent Activities</h3>${D.log.length?D.log.slice(0,7).map(l=>`<div class="flex gap-3 py-1.5 border-b border-slate-100 dark:border-slate-700 text-sm"><i class="fa fa-circle-dot text-emerald-500 mt-1"></i><div class="flex-1">${E(l.m)}</div><div class="text-xs text-slate-400">${l.t}</div></div>`).join(''):empty('No activity yet','Actions will appear here')}</div>
 <div class="card"><h3 class="font-bold mb-3">Top Fee Defaulters <span class="urdu text-sm text-rose-500">بقایا جات</span></h3>${dl.length?dl.map(([id,b])=>`<div class="flex justify-between py-1.5 border-b border-slate-100 dark:border-slate-700 text-sm"><span>${E(stu(id)?.name)} <span class="text-xs text-slate-400">${stu(id)?.cls}</span></span><b class="text-rose-600">${PKR(b)}</b></div>`).join(''):empty('No pending fees 🎉','All dues cleared')}</div></div>`};

/* ---------- Students ---------- */
const sRows=()=>{const q=(ui.sq||'').toLowerCase(),c=ui.sc||'',L=D.students.filter(s=>(!c||s.cls==c)&&(s.name+s.parent+s.phone).toLowerCase().includes(q));
 return L.length?L.map(s=>`<tr><td>${s.roll}</td><td class="font-semibold">${E(s.name)}</td><td>${s.cls}-${s.sec}</td><td>${E(s.parent)}<div class="text-xs text-slate-400">${s.phone}</div></td><td>${s.adm}</td><td>${bd(fst(s.id))}</td><td class="whitespace-nowrap"><button class="btn2" onclick="prof('${s.id}')"><i class="fa fa-eye"></i></button> <button class="btn2" onclick="editStu('${s.id}')"><i class="fa fa-pen"></i></button> <button class="btn2 text-rose-600" onclick="delStu('${s.id}')"><i class="fa fa-trash"></i></button></td></tr>`).join(''):`<tr><td colspan="7">${empty('No students found','Click New Admission to add a student')}</td></tr>`};
P.students=()=>head('Students','طلباء',`<button class="btn" onclick="editStu()"><i class="fa fa-user-plus"></i> New Admission</button>`)+`<div class="card"><div class="flex gap-2 mb-3 flex-wrap"><input class="inp !mt-0 max-w-xs" placeholder="Search name / parent / phone" value="${E(ui.sq||'')}" oninput="ui.sq=this.value;$('tb').innerHTML=sRows()"><select class="inp !mt-0 max-w-[180px]" onchange="ui.sc=this.value;$('tb').innerHTML=sRows()"><option value="">All classes</option>${D.classes.map(c=>`<option ${ui.sc==c.n?'selected':''}>${c.n}</option>`).join('')}</select></div><div class="overflow-x-auto"><table class="w-full"><tr><th>Roll</th><th>Name</th><th>Class</th><th>Parent / Phone</th><th>Admission</th><th>This Month Fee</th><th></th></tr><tbody id="tb">${sRows()}</tbody></table></div></div>`;
function editStu(id){const s=id?stu(id):null;form(s?'Edit Student':'New Admission / نیا داخلہ',[['name','Student Name','wide'],['cls','Class','select',D.classes.map(c=>c.n)],['sec','Section','select',['A','B','C']],['roll','Roll Number','text'],['adm','Admission Date','date'],['parent','Parent Name'],['phone','Phone'],['addr','Address','wide']],s||{adm:today(),sec:'A',cls:'Class 1'},d=>{if(s)Object.assign(s,d);else{const n={id:uid(),...d};D.students.push(n);mkV(n,curM());log(`New admission: ${n.name} (${n.cls})`)}save();toast(s?'Student updated ✅':'Admission complete – fee voucher auto-generated ✅');render()})}
function delStu(id){if(!confirm('Delete this student and their vouchers?'))return;D.students=D.students.filter(s=>s.id!=id);D.vouch=D.vouch.filter(v=>v.sid!=id);save();toast('Student deleted');render()}
function prof(id){const s=stu(id),vs=D.vouch.filter(v=>v.sid==id).sort((a,b)=>b.month.localeCompare(a.month)),ex=Object.keys(D.marks).filter(e=>D.marks[e][id]);

 return head('Fees & Vouchers','فیس',`<button class="btn" onclick="gv()"><i class="fa fa-wand-magic-sparkles"></i> Generate Vouchers</button><button class="btn2" onclick="showInv(fv().map(v=>v.id))"><i class="fa fa-print"></i> Print All</button>`)+`<div class="grid sm:grid-cols-3 gap-4 mb-4"><div class="card"><div class="text-xs text-slate-500">Billed</div><div class="text-xl font-bold">${PKR(b)}</div></div><div class="card"><div class="text-xs text-slate-500">Collected</div><div class="text-xl font-bold text-emerald-600">${PKR(c)}</div></div><div class="card"><div class="text-xs text-slate-500">Pending</div><div class="text-xl font-bold text-rose-600">${PKR(b-c)}</div></div></div>
 <div class="card"><div class="flex flex-wrap gap-2 mb-3 items-center"><input type="month" class="inp !mt-0 max-w-[170px]" value="${m}" onchange="ui.fm=this.value;render()"><button class="btn2 ${!p?'!bg-emerald-600 text-white':''}" onclick="ui.fv='v';render()">Vouchers</button><button class="btn2 ${p?'!bg-emerald-600 text-white':''}" onclick="ui.fv='p';render()">Collection Report</button>${p?'':`<select class="inp !mt-0 max-w-[140px]" onchange="ui.fs=this.value;render()"><option value="">All</option>${['Paid','Partial','Due'].map(x=>`<option ${ui.fs==x?'selected':''}>${x}</option>`).join('')}</select><input class="inp !mt-0 max-w-[200px]" placeholder="Search student" value="${E(ui.fq||'')}" oninput="ui.fq=this.value;$('tb').innerHTML=fRows()">`}</div>
 <div class="overflow-x-auto"><table class="w-full">${p?'<tr><th>Date</th><th>Student</th><th>For Month</th><th>Method</th><th>Amount</th><th></th></tr>':'<tr><th>Voucher</th><th>Student</th><th>Class</th><th>Fee</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>'}<tbody id="tb">${fRows()}</tbody></table></div></div>`};
function gv(){const n=genV(ui.fm||curM());toast(n?`${n} vouchers generated ✅`:'All vouchers already exist','');render()}
function collect(id){const v=D.vouch.find(x=>x.id==id),s=stu(v.sid);form(`Collect Fee – ${E(s.name)} (${mL(v.month)})`,[['amt',`Amount (Balance ${PKR(vBal(v))})`,'number'],['date','Date','date'],['method','Method','select',['Cash','JazzCash','EasyPaisa','Bank Transfer']]],{amt:vBal(v),date:today()},d=>{const a=+d.amt;if(a<=0||a>vBal(v))return toast('Amount must be between 1 and balance','err');addPay(v,a,d.date,d.method);save();toast('Payment received ✅');render();showInv([v.id])})}
function inv(v){const s=stu(v.sid)||{},p=D.pays.filter(x=>x.vid==v.id),b=vBal(v);return `<div class="p-6 bg-white text-slate-800 border-2 border-emerald-600 rounded-xl mb-4" style="page-break-inside:avoid;position:relative"><div class="flex justify-between items-center border-b-2 border-emerald-100 pb-3"><div class="flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xl"><i class="fa fa-graduation-cap"></i></div><div><div class="font-bold text-lg">${E(D.school)}</div><div class="text-xs text-slate-500">Fee Voucher / <span class="urdu">فیس واؤچر</span> • ${E(D.phone)}</div></div></div><div class="text-right text-xs"><div class="font-bold text-emerald-700 text-base">${v.no}</div>Date: ${today()}<br>Month: ${mL(v.month)}</div></div>

function rank(e,c){return D.students.filter(s=>s.cls==c&&D.marks[e]?.[s.id]).map(s=>{const t=sum(D.marks[e][s.id].map(Number));return{sid:s.id,t,p:Math.round(t/SUB.length*10)/10}}).sort((a,b)=>b.t-a.t)}

 return head('Exams & Marks','امتحانات',`<button class="btn" onclick="saveMarks()"><i class="fa fa-floppy-disk"></i> Save Marks</button>`)+`<div class="card"><div class="flex flex-wrap gap-2 mb-4"><select class="inp !mt-0 max-w-[160px]" onchange="ui.ec=this.value;render()">${D.classes.map(x=>`<option ${x.n==c?'selected':''}>${x.n}</option>`).join('')}</select><input list="exl" class="inp !mt-0 max-w-[200px]" value="${E(e)}" placeholder="Exam / Test name" onchange="ui.en=this.value.replace(/['&quot;]/g,'');render()"><datalist id="exl">${Object.keys(D.marks).map(x=>`<option value="${E(x)}">`).join('')}</datalist><span class="text-xs text-slate-400 self-center">Each subject out of 100</span></div>
 ${L.length?`<div class="overflow-x-auto"><table class="w-full"><tr><th>Roll</th><th>Name</th>${SUB.map(x=>`<th>${x}</th>`).join('')}<th>Total</th><th>%</th><th>Grade</th><th>Pos</th><th></th></tr>${L.map(s=>{const m=D.marks[e]?.[s.id],r=R.findIndex(x=>x.sid==s.id);return`<tr><td>${s.roll}</td><td class="font-semibold">${E(s.name)}</td>${SUB.map((x,i)=>`<td><input id="m_${s.id}_${i}" type="number" min="0" max="100" class="inp !w-16 !mt-0 !px-2" value="${m?m[i]:''}"></td>`).join('')}<td>${r>=0?R[r].t:'—'}</td><td>${r>=0?R[r].p+'%':'—'}</td><td>${r>=0?bd(grade(R[r].p)):''}</td><td>${r>=0?'#'+(r+1):''}</td><td>${m?`<button class="btn2" onclick="rcard('${E(e)}','${s.id}')"><i class="fa fa-print"></i></button>`:''}</td></tr>`}).join('')}</table></div>`:empty('No students in this class','Add students first')}</div>`};

/* ---------- Classes ---------- */
P.classes=()=>head('Classes & Fee Structure','کلاسز',`<button class="btn" onclick="addClass()"><i class="fa fa-plus"></i> Add Class</button>`)+`<div class="card overflow-x-auto"><table class="w-full"><tr><th>Class</th><th>Sections (comma separated)</th><th>Monthly Fee (PKR)</th><th>Students</th><th></th></tr>${D.classes.map((c,i)=>`<tr><td class="font-semibold">${c.n}</td><td><input class="inp !mt-0 max-w-[140px]" value="${c.sec}" onchange="D.classes[${i}].sec=this.value;save();toast('Saved')"></td><td><input type="number" class="inp !mt-0 max-w-[140px]" value="${c.fee}" onchange="D.classes[${i}].fee=+this.value;save();toast('Fee structure updated ✅')"></td><td>${D.students.filter(s=>s.cls==c.n).length}</td><td><button class="btn2 text-rose-600" onclick="delClass(${i})"><i class="fa fa-trash"></i></button></td></tr>`).join('')}</table><div class="text-xs text-slate-400 mt-3">Fee changes apply to newly generated vouchers.</div></div>`;
function addClass(){form('Add Class',[['n','Class Name'],['sec','Sections'],['fee','Monthly Fee','number']],{sec:'A'},d=>{D.classes.push({n:d.n,sec:d.sec,fee:+d.fee});save();render()})}
function delClass(i){if(D.students.some(s=>s.cls==D.classes[i].n))return toast('Class has students – move them first','err');D.classes.splice(i,1);save();render()}

/* ---------- Marketing Toolkit ---------- */
function gen(n,e,d,t,i,s,ph){const b=({Emotional:0,Professional:1,Fun:2})[t]||0,x=k=>(b+i+k)%3,dd=d?`\n\n📝 ${d}`:'',tag='#'+n.replace(/[^a-z0-9]/gi,'');
 const wa=[`${e} *${n}* ${e}\n\nAaj ${s} mein ${n} ka din bohat yaadgar raha! ✨\nHamare nanhe sitaron ki muskurahat hi hamari sabse badi kamyabi hai. 💚${dd}\n\n_Taleem ke saath Tarbiyat_ 🎓\n📞 Admissions Open: ${ph}`,
 `${e} Alhamdulillah! Aaj ${s} mein ${n} hua.\n"Aaj ke bachay, kal ka Pakistan" 🇵🇰${dd}\n\nApne bachay ka roshan mustaqbil — ${s} ke saath.\n📲 Rabta karein: ${ph}`,
 `✨ ${n} ✨\nProud moment for our ${s} family! 👏 Bachon ki mehnat aur teachers ki lagan rang laayi. 💪${dd}\n\nAdmissions Open | Limited Seats 🏫 ${ph}`],
 cap=[`${e} ${n} at ${s}! ${e}\n\nA day full of learning, laughter and proud parent moments! ✨ Hamare bachon ne dikha diya ke jab talent ko sahi rehnumai milti hai to kamal ho jata hai.${dd}\n\n💚 Why parents trust ${s}:\n✅ Qualified & caring teachers\n✅ Safe, clean & CCTV-monitored campus\n✅ Islamic values + modern education\n✅ Regular parent updates on WhatsApp\n\n📲 Admissions Open — Call/WhatsApp: ${ph}\n👨‍👩‍👧 Tag a parent who must see this! ❤️`,
 `${e} Moments that make us proud — ${n}!\n\nAt ${s}, we believe every child is a star. 🌟 Today's ${n} was proof of the confidence, creativity and character we build every single day.${dd}\n\n🎯 Limited seats left for the new session.\n📞 ${ph}\n💬 DM us "ADMISSION" for fee structure & free campus visit!`,
 `Aaj ${s} mein kya hua? 😍 ${n}! ${e}\n\nBachay seekhte bhi hain aur enjoy bhi karte hain — yehi hai asli taleem! 🎒💚${dd}\n\n👉 Apne bachay ko dein behtareen shuruaat.\n📍 Visit us for a FREE campus tour\n📞 ${ph}\n\nLike ❤️ Share 🔁 Follow 📲`],
 reel=[`🎬 "${n}" – 20s Reel\n\n⏱ 0–3s HOOK: Fast zoom on the busiest moment. Text: "Aaj ${s} mein kya hua? 😍"\n⏱ 3–10s: 3 quick clips (bachon ke chehre, teacher ki muskurahat, activity close-up). Voiceover: "${n} — jahan bachay seekhte bhi hain aur muskurate bhi!"\n⏱ 10–17s: Ek bachay ka one-liner: "Mujhe aaj bohat maza aaya!"\n⏱ 17–20s CTA: School gate + logo. Text: "Admissions Open 📞 ${ph}"\n\n🎵 Soft upbeat track • Urdu+English subtitles • Post 7–9 PM`,
 `🎬 "Parent Reaction" – 25s Reel\n\n⏱ 0–4s: Walk into ${n} with camera. Text: "Dekhiye hamare bachon ka kamal ${e}"\n⏱ 4–15s: Slow-mo montage of best 5 moments, beat-synced.\n⏱ 15–22s: Parent (with permission): "Mujhe ${s} par fakhar hai."\n⏱ 22–25s: Text: "Apne bachay ko bhi banayein ${s} ka hissa — ${ph}"\n\n🎵 Trending instrumental • Add Urdu captions • Post at lunch time`,
 `🎬 "Before vs After" – 15s Reel\n\n⏱ 0–5s: Empty hall/ground, text "Subah 8 baje…"\n⏱ 5–12s: Beat drop → ${n} full of energy & colour! ${e}\n⏱ 12–15s: Text: "Yeh hai ${s} ka din! Admissions Open 📞 ${ph}"\n\n🎵 Upbeat beat drop • Short & punchy • Post on Reels + Shorts + TikTok`],
 hs=['#PakistaniSchools','#EducationPakistan','#SchoolLife','#AdmissionsOpen','#PrivateSchool','#BestSchool','#Taleem','#ParentsOfPakistan','#FutureLeaders','#PakistanZindabad',tag,'#'+s.replace(/[^a-z0-9]/gi,'')].join(' ');
 return[['fa-brands fa-whatsapp','text-green-600','WhatsApp Status / واٹس ایپ اسٹیٹس',wa[x(0)]],['fa-brands fa-facebook','text-blue-600','Facebook / Instagram Caption',cap[x(1)]],['fa-clapperboard','text-rose-500','Reel / TikTok / Shorts Idea + Script',reel[x(2)]],['fa-hashtag','text-sky-600','Hashtags',hs]]}
P.mkt=()=>{const m=ui.mk||{},o=m.n?gen(m.n,m.e||'🎉',m.d,m.t,m.i||0,D.school,D.phone):null;OUT=o?o.map(x=>x[3]):[];
 return head('Marketing Toolkit','مارکیٹنگ ٹول کٹ','<span class="px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-semibold">⭐ Daily content in 1 click</span>')+`<div class="grid xl:grid-cols-3 gap-4"><div class="card xl:col-span-1 h-fit"><h3 class="font-bold mb-2">Aaj school mein kya hua?</h3><label class="text-xs font-semibold">Today's activity / news / event<input id="mn" class="inp" placeholder="e.g. Science fair held today" value="${E(m.n||'')}"></label><label class="text-xs font-semibold block mt-3">Extra details (optional)<input id="md" class="inp" placeholder="e.g. Class 5 won 1st prize" value="${E(m.d||'')}"></label><label class="text-xs font-semibold block mt-3">Tone<select id="mt" class="inp">${['Emotional','Professional','Fun'].map(x=>`<option ${m.t==x?'selected':''}>${x}</option>`).join('')}</select></label><button class="btn w-full mt-4" onclick="mkGen()"><i class="fa fa-wand-magic-sparkles"></i> Generate Content</button>
 <h4 class="font-bold mt-5 mb-2 text-sm">Template Library</h4><div class="flex flex-wrap gap-2">${LIB.map((l,i)=>`<button class="btn2 text-xs" onclick="lib(${i})">${l[0]} ${l[1]} <span class="urdu">${l[2]}</span></button>`).join('')}</div></div>
 <div class="xl:col-span-2 space-y-4">${o?o.map((x,i)=>`<div class="card"><div class="flex items-center justify-between mb-2"><h3 class="font-bold"><i class="${x[0]} ${x[1]}"></i> ${x[2]}</h3><div class="flex gap-2">${i==0?`<a class="btn2" target="_blank" href="https://wa.me/?text=${encodeURIComponent(x[3])}"><i class="fa-brands fa-whatsapp"></i> Share</a>`:''}<button class="btn2" onclick="cp(${i})"><i class="fa fa-copy"></i> Copy</button></div></div><div class="whitespace-pre-wrap text-sm bg-emerald-50/60 dark:bg-slate-700/50 rounded-xl p-4">${E(x[3])}</div></div>`).join('')+`<div class="text-center"><button class="btn2" onclick="ui.mk.i++;render()"><i class="fa fa-rotate"></i> Regenerate new variation</button></div>`:`<div class="card">${empty('Aapka content yahan ayega','Type today’s activity or tap a template to get a WhatsApp status, caption, reel script & hashtags instantly')}</div>`}</div></div>`};
function mkGen(){const n=$('mn').value.trim();if(!n)return toast('Please type today’s activity first','err');ui.mk={n,e:'🎉',d:$('md').value.trim(),t:$('mt').value,i:0};log('Marketing content created: '+n);save();render()}
function lib(i){ui.mk={n:LIB[i][1],e:LIB[i][0],d:'',t:'Emotional',i:0};render()}
function cp(i){navigator.clipboard.writeText(OUT[i]).then(()=>toast('Copied ✅'),()=>toast('Copy failed','err'))}

/* ---------- Demo guide ---------- */
const nxt=()=>addM(curM(),1);
function dAdm(){if(D.students.some(s=>s.name=='Muhammad Danish'))return toast('Demo student already exists','err');const s={id:'demo1',name:'Muhammad Danish',cls:'Class 5',sec:'A',roll:'31',parent:'Mr. Tariq Mehmood',phone:'0321-5550123',addr:'House 12, Street 4, Gulshan Colony',adm:today()};D.students.push(s);mkV(s,curM());log('New admission: Muhammad Danish (Class 5)');save();ui.sq='Danish';toast('Admission done + fee voucher auto-generated ✅');go('students')}
function dAtt(){D.att[today()]={};D.students.forEach((s,i)=>D.att[today()][s.id]=i%9==4?'A':i%13==6?'L':'P');log('Student attendance marked – all classes');save();ui.at='att';ui.ad=today();ui.ac='Class 5';toast('Attendance marked ✅');go('att')}
function dSAtt(){D.satt[today()]={};D.staff.forEach((s,i)=>D.satt[today()][s.id]=i==3?'L':'P');log('Staff attendance marked');save();ui.at='satt';ui.ad=today();toast('Staff attendance marked ✅');go('att')}
function dExam(){const e='Monthly Test';D.marks[e]=D.marks[e]||{};D.students.filter(s=>s.cls=='Class 5').forEach(s=>D.marks[e][s.id]=SUB.map(()=>60+Math.random()*38|0));log('Marks entered: Monthly Test (Class 5)');save();ui.ec='Class 5';ui.en=e;toast('Marks saved ✅');go('exams')}
function dGen(){ui.fm=nxt();ui.fv='v';const n=genV(nxt());toast(`${n} vouchers for ${mL(nxt())} ✅`);go('fees')}
function dColl(){ui.fm=curM();ui.fv='v';ui.fq='Danish';const v=D.vouch.find(v=>v.sid=='demo1'&&v.month==curM());if(!v)return toast('Pehle step 2 (admission) karein','err');if(vBal(v)>0)addPay(v,Math.min(1000,vBal(v)),today(),'JazzCash');save();go('fees');showInv([v.id]);toast('Partial payment received – invoice ready ✅')}
function dExp(){D.acc.push({id:uid(),date:today(),type:'Expense',cat:'Maintenance',amt:4500,note:'Generator diesel',});log('Expense: Maintenance Rs 4,500');if(!D.acc.some(a=>a.ref=='sal-t0-'+curM()))paySal('t0');save();toast('Expense + salary recorded ✅');go('acc')}
function dMkt(){ui.mk={n:'Science Fair',e:'🔬',d:'Class 5 students presented 20 working models',t:'Emotional',i:0};go('mkt')}
const STEPS=[['Dashboard Overview','ڈیش بورڈ','Owner ko poora school ek nazar mein: students, staff, fees, attendance, collection. Yahan se demo shuru karein.',()=>go('dash'),'Open Dashboard'],
['New Admission → Auto Fee Voucher','نیا داخلہ','Danish ka admission (parent, phone, class, date) save hota hai aur is mahine ka fee voucher khud ban jata hai.',dAdm,'Admit Demo Student'],
['Student Attendance (Class-wise)','حاضری','Class select karein, Present/Absent/Leave mark karein — percentage khud calculate hota hai.',dAtt,'Mark Today’s Attendance'],
['Staff / Teacher Attendance','اسٹاف حاضری','Teachers aur staff ki daily attendance ek hi screen par.',dSAtt,'Mark Staff Attendance'],
['Exam / Test Marks + Report Card','نتائج','Class 5 ke marks enter hote hain; total, %, grade aur position khud nikalti hai. Report card print karein.',dExam,'Enter Test Marks'],
['Monthly Fee Vouchers (Next Month)','ماہانہ واؤچر','Ek click par poore school ke agle mahine ke vouchers. "Print All" se sab print.',dGen,'Generate Next Month Vouchers'],
['Collect Fee → Partial Payment → Invoice','فیس وصولی','Danish ki aadhi fees (Rs 1,000) lein; remaining balance track hota hai aur printable invoice banta hai.',dColl,'Collect Rs 1,000 & Show Invoice'],
['Daily Accounts + Salary','روزانہ حساب','Expense entry aur teacher salary payment — daily/monthly cash flow foran update.',dExp,'Add Expense & Pay Salary'],
['Marketing Toolkit ⭐','مارکیٹنگ','Aaj ki activity likhein → WhatsApp status, Facebook caption, Reel script aur hashtags ready. Yeh aapki USP hai!',dMkt,'Generate Marketing Content'],
['Final Dashboard','فائنل','Dobara dashboard dekhein: collection, attendance aur pending fees sab update ho chuke hain.',()=>go('dash'),'View Updated Dashboard']];
P.demo=()=>head('Demo Guide','ڈیمو گائیڈ','<button class="btn2 text-rose-600" onclick="resetD()"><i class="fa fa-rotate-left"></i> Reset Demo Data</button>')+`<div class="card mb-4"><h3 class="font-bold mb-2">School Settings</h3><div class="grid sm:grid-cols-2 gap-3"><label class="text-xs font-semibold">School Name<input class="inp" value="${E(D.school)}" onchange="D.school=this.value;save();render()"></label><label class="text-xs font-semibold">WhatsApp / Phone (used in marketing)<input class="inp" value="${E(D.phone)}" onchange="D.phone=this.value;save();toast('Saved')"></label></div></div>
 <div class="text-sm text-slate-500 mb-3">Client ko complete flow dikhane ke liye upar se neeche steps ko ek ek karke chalayein. Har step data khud bhar deta hai.</div><div class="space-y-3">${STEPS.map((s,i)=>`<div class="card flex gap-4 items-center"><div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold shrink-0">${i+1}</div><div class="flex-1"><div class="font-bold">${s[0]} <span class="urdu text-emerald-600 text-sm">${s[1]}</span></div><div class="text-sm text-slate-500">${s[2]}</div></div><button class="btn shrink-0" onclick="STEPS[${i}][3]()">${s[4]}</button></div>`).join('')}</div>`;
function resetD(){if(confirm('Reset all data to fresh demo data?')){localStorage.removeItem(K);seed();save();ui={};render();toast('Demo data reset ✅')}}

/* ---------- init ---------- */
D=JSON.parse(localStorage.getItem(K)||'null');if(!D){seed();save()}
if(localStorage.getItem('edupak_dk'))document.documentElement.classList.add('dark');
render();
</script></body></html>
